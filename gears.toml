[[build_preset]]
name = "Bcf1Gcc263"
# battle_command_file1 (archive 0x20 file 1) is gcc 2.6.3 (psx) code: 23 of its
# INCLUDE_ASM bodies match only under 2.6.x, and the TUs stay byte-exact as a
# whole under it.  Listed per TU so the CDK-compiled tail
# (after_controller_cdk, BattleCdk above) is matched by exactly one preset.
build_variables = {
    gcc = "gcc-2.6.3-psx"
}
paths = [
    "src/battle_command_file1/before_controller.",
    "src/battle_command_file1/message_controller.",
    "src/battle_command_file1/after_controller.",
]

[[build_preset]]
name = "BattleGcc263Div"
# gcc 2.6.3 like BattleGcc263, plus maspsx --expand-div: retail main69's
# signed division (func_800A5BE8's plane height) and main73_p1's
# (func_800AF2C4) carry the aspsx divide-by-zero / overflow `break` checks.
# main74 and main68 (formerly the gcc 2.7.2 "BattleDiv" preset) are 2.6.3
# code too: func_800B10EC's and func_800A44C0's register choices and
# narrowed loads only come out of 2.6.3, and both TUs stay byte-exact.
# main67 moved here from BattleGcc263: func_800A32D8's three colour-fade
# divides carry the checks, and no other main67 function divides.
build_variables = {
    gcc = "gcc-2.6.3-psx",
    maspsx_flags = "--expand-div --use-comm-section --run-assembler"
}
# main64 (2026-10-13, BattleGcc263 since earlier that day for func_8009E788's
# `-= 1` decrement, which gives addiu 0xFF only under 2.6.0/2.6.3):
# func_8009F1C4's three signed divisions carry the checks.  main64's other
# C is the same with or without --expand-div (no divisions).
# main70 (2026-10-15, BattleGcc263 since 10-12): func_800A7948's twelve
# divisions (cloth springs and normal averaging) carry the checks, and so do
# retail func_800A7064's two.
paths = [ "src/battle/main69.", "src/battle/main73_p1.", "src/battle/main74.", "src/battle/main68.", "src/battle/main65.", "src/battle/main67.", "src/battle/main64.", "src/battle/main70." ]

[[build_preset]]
name = "WorldMapDiv"
# world_map: default compiler (the gcc-2.7.2 survey matched 33 m2c drafts
# standalone) plus maspsx --expand-div: all 18 of its functions with a div
# carry the aspsx divide-by-zero / overflow break checks, and small
# constants are literal li (addiu $x, $zero, n), so --dont-expand-li too.
build_variables = {
    maspsx_flags = "--dont-expand-li --expand-div --use-comm-section --run-assembler"
}
paths = [ "src/world_map/" ]

[[build_preset]]
name = "BattleNoSched1"
# func_800AA898 (mainasm_3ADA8, the only C function in that TU) is byte-exact
# only with sched1 off: the Default gcc 2.7.2 settings plus
# -fno-schedule-insns.  This is an observed match, not proof of the original
# build settings.  sched1-off changes 63% of the other matched battle
# functions (draft-independent flag map, 2026-10-20), so no other TU may use
# this preset.
# The flag goes in cc_flags (Default's cc_flags plus -fno-schedule-insns):
# the decomp_assist tools split cc_flags but pass optimization_flag as one
# argument.
build_variables = {
    cc_flags = "-mips1 -mcpu=3000 -w -funsigned-char -fpeephole -ffunction-cse -fpcc-struct-return -fcommon -fverbose-asm -msoft-float -mgas -fgnu-linker -quiet -fno-schedule-insns"
}
paths = [ "src/battle/mainasm_3ADA8." ]
