[directories]
config = 'config'
linker = 'linker'
code = 'src'
assembly = 'asm'
build = 'build'

[compilation]
binary = "slus_006.64"
overlays = ["field", "member_change_menu", "shop_menu", "name_entry_menu", "menu", "battle", "battling", "movie", "battle_command_file1", "battle_module_0c4", "world_map"]
target = 'mips-linux-gnu'

[[build_preset]]
name = "Default"
# Every other preset will inhert the build variables from Default unless they override it
build_variables = {
    gcc = "gcc-2.7.2-psx",
    cc_flags = "-mips1 -mcpu=3000 -w -funsigned-char -fpeephole -ffunction-cse -fpcc-struct-return -fcommon -fverbose-asm -msoft-float -mgas -fgnu-linker -quiet",
    # Use the same exported jump-table labels as standalone Splat assembly.
    cpp_flags = "-D_LANGUAGE_C -DUSE_INCLUDE_ASM -DINCLUDE_ASM_USE_MACRO_INC=1 -P -MMD -MP -undef -Wall -lang-c -nostdinc",
    ld_flags = "-nostdlib --no-check-sections",
    maspsx_flags = "--use-comm-section --run-assembler",
    optimization_flag = "-O2",
    gp_flag = "-G8",
    endianness = "-EL"
}

[[build_preset]]
name = "PSY-Q"
build_variables = {
    maspsx_flags = "--aspsx-version=2.56 --expand-div --use-comm-section --run-assembler",
    optimization_flag = "-O3",
    gp_flag = "-G0"
}
paths = [ "{binary}/psyq" ]

[[build_preset]]
name = "XenoLibrary"
build_variables = {
    gcc = "gcc-2.6.0-psx"
}
paths = [
    "{binary}/system/libarchive.",
    "{binary}/system/sound.",
    "member_change_menu/main/misc.",
    "name_entry_menu/main/misc.",
    "shop_menu/main/misc.",
    # The shop overlay's retail code interleaves unmatched regions with C runs,
    # so its single TU is split over misc{,2..9}.c; every one of them is the
    # same retail compiler (gcc-2.6.0-psx).  Preset keys are substring matches,
    # so `shop_menu/main/misc.` would miss misc2.c..misc9.c and silently compile
    # them with the Default 2.7.2 preset (measured: 15 functions changed size).
    "shop_menu/main/misc2.",
    "shop_menu/main/misc3.",
    "shop_menu/main/misc4.",
    "shop_menu/main/misc5.",
    "shop_menu/main/misc6.",
    "shop_menu/main/misc7.",
    "shop_menu/main/misc8.",
    "shop_menu/main/misc9.",
]

[[build_preset]]
name = "XenoGraphics263"
# temp1e1 (func_800251C8 alone): aspsx 2.67 like its XenoGraphics
# neighbours, but only gcc-2.6.3-psx (provenance: see MenuG0) schedules its
# stack load of `height` before the bounds check, as retail does.
build_variables = {
    gcc = "gcc-2.6.3-psx",
    maspsx_flags = "--aspsx-version=2.67 --use-comm-section --run-assembler"
}
paths = [ "{binary}/system/temp1e1." ]

[[build_preset]]
name = "XenoGraphics"
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--aspsx-version=2.67 --use-comm-section --run-assembler"
}
paths = [
    "{binary}/system/animation_scripts.",
    "{binary}/system/temp1a.",
    "{binary}/system/temp1c.",
    "{binary}/system/temp1d.",
    "{binary}/system/temp1e.",
    "{binary}/system/temp1e2.",
]

[[build_preset]]
name = "BattleLiteral"
# The battle layout has two assembler flavours of the `li` expansion: most
# bodies use maspsx's lui/ori form, but a handful of retail bodies encode the
# constant as `addiu $r,$zero,K` exactly like gas does when maspsx leaves `li`
# alone.  Only the addiu-flavoured TUs (named `mainl*`) select this preset; it
# changes nothing but the li expansion.  Listed per TU: gears takes the first
# preset whose key matches (table order, not longest key), so a "battle/mainl"
# prefix here would shadow BattleCdk's mainl110 entry below.
build_variables = {
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler"
}
paths = [
    "src/battle/mainl94.",
    "src/battle/mainl98.",
    "src/battle/mainl109.",
    "src/battle/mainl115.",
]

[[build_preset]]
name = "SdataSmall"
# Only TUs whose retail addresses *extern* (not TU-defined) symbols via
# %gp_rel select this preset; it changes nothing but -G forwarding.
# NOTE (temp3 lesson): a TU whose retail mixes absolute extern access with
# %gp_rel does NOT belong here. The %gp_rel sites must be same-TU small
# definitions (cc1 -G8 then emits explicit %gp_rel regardless of the
# assembler -G flag), while plain externs assemble absolute under the
# Default preset (maspsx force-appends -G0). Putting such a mixed TU here
# flips every absolute access to GPREL16 and regresses the whole TU.
#
# temp1. and animation_scripts. were removed for exactly that reason: they are
# mixed TUs, and listing them here was what kept build/out/slus_006.64 from
# linking at all.  With --dont-force-G0 their plain externs assembled as
# GPREL16, and four of them sit outside the +/-32 KiB window around the retail
# gp (0x80059170): D_80050100 (-0x9070), D_8006BE10, D_800C3664, D_800C3E1C,
# plus D_8006F99C / D_8006F9AC from animation_scripts.  ld then reported
# "small-data section too large" with truncated R_MIPS_GPREL16 relocations.
# Retail reaches those four with lui %hi / %lo -- see
# asm/slus_006.64/matchings/system/temp1/func_800257F0.s:119, which is a
# plain `lui $s0, %hi(D_80050100)`, not a gp-relative load.  So absolute is
# the retail-correct encoding here and the Default preset is the right home.
build_variables = {
    maspsx_flags = "--dont-force-G0 --use-comm-section --run-assembler",
}
paths = [
    "{binary}/system/memory.",
    "{binary}/system/heap_debug.",
]

[[build_preset]]
name = "SdataSmallLiteral"
# SdataSmall's -G handling, plus the literal `li` flavour: retail work_list,
# rendering and graphics never use the lui/ori `li` expansion (every small
# constant load is `addiu $r,$zero,K`, 0 `ori $r,$zero,K` in their asm).
build_variables = {
    maspsx_flags = "--dont-expand-li --dont-force-G0 --use-comm-section --run-assembler",
}
paths = [
    "{binary}/system/rendering.",
    "{binary}/system/graphics.",
]

[[build_preset]]
name = "MenuG0"
# menu.bin never addresses anything through $gp, so its cc1 runs with -G0 like
# the other overlays.  (-G8 used to hoist every INCLUDE_ASM ahead of the C
# bodies.  include/include_asm.h now wraps INCLUDE_ASM in a function, which
# keeps source order either way, but -G8 still leaves menu.bin 204 bytes off
# retail: rodata 0x0-0xC4 plus about 40 text words.)
# Key is prefixed with src/ so it cannot match shop_menu/ or
# member_change_menu/ paths (preset keys are substring matches).
#
# Compiler: gcc 2.6.3 (psx), not the Default 2.7.2.  Retail menu writes a
# constant-divide's high word straight into the result register (`mfhi $v0`),
# which 2.7.2 never does (it goes through a scratch).  2.6.3 matches it, is a
# strict superset of 2.7.2's matches on the original all-C misc.c (205 vs
# 204), and also unlocks bodies 2.7.2 can't reach (e.g. func_801D84B4,
# func_801E4928, func_801D1258, func_801DE29C).
# tools/gcc-2.6.3-psx/cc1 comes from
#   https://github.com/decompals/old-gcc/releases/download/0.12/gcc-2.6.3-psx.tar.gz
# (the decomp.me "gcc2.6.3-psx" ps1 compiler).
#   sha256(cc1) = 16696ec7b00a15c76bb5c245904799b547af59028416896e833eabc2939ed17a
build_variables = {
    gcc = "gcc-2.6.3-psx",
    gp_flag = "-G0"
}
paths = [ "src/menu/main/misc.", "src/menu/main/misc1b.", "src/menu/main/misc2.", "src/menu/main/misc3." ]

[[build_preset]]
name = "XenoLiteral"
# Default preset plus the literal `li` flavour. Retail temp1's compiled code
# encodes every small constant load as `addiu $r,$zero,K`; its only
# `ori $r,$zero,K` loads are in the trailing line-scroll bodies
# (func_8002709C/800273C4/800278F8), which are INCLUDE_ASM.
build_variables = {
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler",
}
paths = [
    "{binary}/system/temp1.",
    "{binary}/system/temp1b.",
    "{binary}/system/temp1f.",
    "{binary}/system/work_list.",
]

[[build_preset]]
name = "XenoMain"
build_variables = {
    gp_flag = "-G0"
}
paths = [ "{binary}/main/main_loop." ]

[[build_preset]]
name = "BattleCdk"
# Part of the battle overlay was built with the CDK compiler: it materialises a
# call argument's symbol address as `lui %hi` before the call with `addiu %lo`
# in the jal delay slot (and the a0 copy before the `lui`), where the PSY-Q
# 2.7.2 cc1 emits a single `la` that gas expands in place.  Those TUs also
# encode `li` as `addiu $r,$zero,K`, so they take the literal flavour too.
# Bodies verified by shape harness: func_800B5924 38/38, func_800B5C18 42/42,
# func_800BF7C8 37/37 (vs 34/38, 39/42, 33/37 with gcc-2.7.2-psx).
# main87, main90, mainasm_4F3C4 and main101 are CDK code too: their
# drafts (func_800B5FBC, func_800B6518, func_800BEEB4, func_800B81BC, ...)
# match only here.
# mainl110 and main111 (2026-10-03): their retail has 30 compiler-split
# %hi/%lo loads (the lui hoisted into another register away from its %lo
# use), which only the CDK cc1 emits; func_800B9C00 matches only here and
# the TUs' existing bodies (func_800BA59C, func_800BA8F4, func_800BAC50,
# func_800BAF40) still match.  BattleLiteral lists its mainl TUs
# explicitly so this entry is the only match for mainl110.
# main135 (2026-10-12): func_800C11CC's switch tables load as lui/addiu +
# sll/addu/lw and its constants as `addiu $r,$zero,K`, the CDK forms; it
# matches only here (gcc-2.7.2-psx emits the `lui $at` table load).
# main77 (2026-10-12): func_800B1F0C keeps the work-buffer %hi in a register
# for its split %lo load/store and copies its prim template through the
# template's address; it matches only here (2.7.2 / 2.6.3: +2 insns), and
# main77's three matched functions stay byte-exact.
# mainasm_B190 (2026-10-12): func_8007AC80, the mainc18 family's multiply
# between mainc18_q1 and mainc18_q2, matches only here (the same body is
# 11 instructions off under 2.7.2, 2.6.3 and 2.6.0).
# main125_q1 (2026-10-12): its only function, func_800BEE2C, encodes its
# constants as `addiu $r,$zero,K` (the literal flavour) and sits right
# before mainasm_4F3C4 (also CDK); under Default it is 2 instructions off.
# main75 (2026-10-12): plain C for func_800B15D8 comes within 3 of its 45
# instructions only here (the same C is 49 instructions under 2.7.2, 2.6.3
# and 2.6.0).  The last 3 need a do/while(0) scheduling barrier in the body
# (see main75.c); main75's other bodies stay byte-exact.
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler"
}
paths = [
    # Every battle/mainc* TU except mainc100, mainc118, mainc122, mainc124
    # and mainc134 (BattleCdkG0 below); gears takes whichever matching key
    # its HashMap yields first, so no TU may match keys of two presets.
    "battle/mainc102.",
    "battle/mainc104.",
    "battle/mainc107.",
    "battle/mainc108.",
    "battle/mainc112.",
    "battle/mainc113.",
    "battle/mainc114.",
    "battle/mainc114_p1.",
    "battle/mainc114_p2.",
    "battle/mainc115.",
    "battle/mainc116.",
    "battle/mainc117.",
    "battle/mainc120.",
    "battle/mainc123.",
    "battle/mainc126.",
    "battle/mainc127.",
    "battle/mainc129.",
    "battle/mainc130.",
    "battle/mainc131.",
    "battle/mainc132.",
    "battle/mainc15.",
    "battle/mainc18_",
    # "battle/mainc2" minus mainc25_q1 (BattleGcc263 below, 2026-10-12).
    "battle/mainc25.",
    "battle/mainc25_q2.",
    "battle/mainc29",
    "battle/mainc7",
    "battle/mainc8",
    "battle/mainc9",
    "src/battle/main87.",
    "src/battle/main90.",
    "src/battle/mainasm_4F3C4.",
    "src/battle/main101.",
    "src/battle/mainl110.",
    "src/battle/main111.",
    "src/battle/main96.",
    "src/battle/main103.",
    "src/battle/mainl133.",
    "src/battle/mainl81.",
    "src/battle/main135.",
    "src/battle/main77.",
    "src/battle/mainasm_B190.",
    "src/battle/main125_q1.",
    "src/battle/main75.",
    # main106 (2026-10-13): func_800B8DA4 and func_800B8EBC encode their
    # small constants as `addiu $r,$zero,K` and keep %hi parts in
    # s-registers across calls (the CDK forms; found by a li-flavour scan of
    # the remaining asm against each TU's preset).  Both match here and not
    # under Default or BattleLiteral (2.7.2 leaving li to the assembler:
    # 308 vs 280 and 368 vs 356 bytes); func_800B9020 compiles to the same
    # bytes.
    "src/battle/main106.",
    # mainl92 (2026-10-13, moved from BattleLiteral): func_800B6A7C matches
    # under the CDK cc1; with the same leave-li flags it is 13/71 off under
    # 2.7.2, 2.6.3 and 2.6.0 (under 2.7.2: an actor/value s-register swap
    # that declaration order does not move).  mainl92's func_800B6B98 and
    # func_800B6BFC compile to the same bytes under the CDK cc1.
    "src/battle/mainl92.",
    "src/battle_command_file1/after_controller_cdk.",
]

[[build_preset]]
name = "BattleCdkG0"
# BattleCdk with cc1 at -G0 (2026-10-12).  The battle overlay never addresses
# anything through $gp and the CDK TUs have no `$at` stores, so its CDK code
# looks -G0-built; func_800BE790's clamp needs it: retail emits
# %hi(D_80059494) before the Vsync call on the right-hand side (into a
# callee-saved register), which only a VAR_DECL left-hand side with a split
# (non-small) address gives, since MODIFY_EXPR pre-expands calls for any
# other LHS.  Scoped to this TU because -G0 across BattleCdk breaks at
# least mainc29_q2 (the first differing TU; others untested); mainc122's
# other bodies match either way.
# mainc124 (2026-10-12): func_800BED4C matches only with the CDK cc1 at -G0
# (its scalar D_800C3610 view gets a split %hi in $s0 and keeps scalar alias
# rules; CDK -G8: each reload is a $at macro, +2 insns; 2.7.2, 2.6.3 and
# 2.6.0 at -G8 or -G0: 41 insns, far off); func_800BEDE8 matches either way.
# mainc134 (2026-10-14): func_800C0D18 reloads its scalar D_800C3A68 table
# pointer through one split %hi in $t0, and its last two reloads move
# ahead of stores through `out` (scalar alias rules); it matches only here
# (CDK -G8: a %hi per reload, 612 vs 600 bytes; 2.7.2, 2.6.3 and 2.6.0 at
# -G8 or -G0: 616; an incomplete-array view gets the split %hi but keeps
# the reloads behind the stores, 620).  The TU's other bodies stay
# byte-exact (full relink).
# mainc100 (2026-10-14): func_800B7C34 clears an actor's slot bit in
# D_800C3666 and then passes the slot to func_800BB080.  The store makes
# CSE reload the actor words for the call, and retail schedules those
# loads above the store, which needs a scalar D_800C3666 against
# struct-field actor loads; the scalar's %hi is split (in $a1) only at
# -G0.  It matches only here (CDK -G8: 624 vs 608 bytes; 2.7.2, 2.6.3
# and 2.6.0 at -G8 or -G0: 648); the TU's other bodies stay byte-exact
# (full relink).
# mainc118 (2026-10-14): func_800BD3AC loads the target's words and the
# font pointer (D_800D2F5C) above stores to the new popup task and the
# chain head (D_800C3750), which needs scalar globals against struct-field
# accesses; the scalars split their %hi only at -G0.  It matches only
# here (CDK -G8: 1020 vs 1012 bytes; 2.7.2, 2.6.3 and 2.6.0 at -G8 or
# -G0: 81/253, 1024, 1024); the TU's other bodies stay byte-exact (full
# relink).
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler",
    gp_flag = "-G0"
}
paths = [
    "src/battle/mainc122.",
    "src/battle/mainc124.",
    "src/battle/mainc134.",
    "src/battle/mainc100.",
    "src/battle/mainc118.",
]

[[build_preset]]
name = "XenoGraphicsLibrary"
build_variables = {
    gcc = "gcc-2.6.0-psx",
    maspsx_flags = "--expand-div --use-comm-section --run-assembler",
}
paths = [
    "{binary}/graphics/line_scroll.",
]

