# Raw archive directory 0x20, offset 0, file 1. This is not battle.bin.
# Other dynamic battle modules reuse 0x801E5000; keep a separate namespace.
#
# This layout MATCHES retail byte-for-byte (19,516 B, sha1 below) as of
# 0b4876e2 and is unchanged since.  If a build reports 19,512 B / ~56%
# differing, the overlay was NOT rebuilt: `gears matching` died and gears
# silently ignores splat's exit code, so ninja relinked a stale tree.  Check
# splat's stderr before touching anything here.
name: Battle command module, archive 0x20 file 1
sha1: 846845462141838c9b94a4a61c315b0876bde352
options:
  basename: battle_command_file1.bin
  target_path: disc/battle_command_file1.bin
  base_path: ../
  platform: psx
  compiler: PSYQ
  asm_path: asm/battle_command_file1
  src_path: src/battle_command_file1
  build_path: build/
  ld_script_path: linker/battle_command_file1.ld
  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  symbol_name_format: battle_command_file1_$VRAM
  symbol_name_format_no_rom: $VRAM
  section_order: [".rodata", ".text", ".data", ".bss"]
  symbol_addrs_path:
    - config/symbol_addrs.battle_command_file1.txt
    - config/symbol_addrs.slus_006.64.txt
  undefined_funcs_auto_path: linker/undefined_funcs_auto.battle_command_file1.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.battle_command_file1.txt
  extensions_path: tools/splat_ext
  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
segments:
  - name: battle_command_file1
    type: code
    start: 0
    vram: 0x801E5000
    align: 4
    subalign: 4
    subsegments:
      - [0x0000, rodata, dispatch]
      - [0x0160, c, before_controller]
      # Matching uses splat `asm`, not src/battle_command_file1/message_controller.c.
      # That C reconstruction is 0x4E8 bytes against retail 0x4EC, which shifts
      # every later address by 4 and leaves the overlay 4 bytes short.  The C
      # file stays for the port; it is not the matching-build input.
      - [0x1CE8, asm, message_controller]
      - [0x21D4, c, after_controller]
      - [0x4B5C, data, module_data]
  - [0x4C3C]
