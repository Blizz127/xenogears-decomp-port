name: Shop Menu Overlay
sha1: 5e3c656ba4ce5489a1f1da05c2e8aeba756855f1
options:
  basename: shop_menu.bin
  target_path: disc/shop_menu.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/shop_menu
  src_path: src/shop_menu
  build_path: build/

  ld_script_path: linker/shop_menu.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.shop_menu.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - configs/reloc_addrs.shop_menu.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.shop_menu.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.shop_menu.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: shop_menu
    type: code
    start: 0x0
    vram: 0x801c5000
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, main/misc]
      - [0x40, c, main/misc]
      # The retail overlay interleaves still-assembly functions with C runs.
      # INCLUDE_ASM expands to a file-scope __asm__ block and cc1 emits every
      # such block before every compiled body, so a TU that mixes both pushes
      # all of its C functions to the end of the object (measured: all 104 C
      # functions landed +15548 bytes from their retail addresses while every
      # function size was already exact).  Model one TU per retail run pair -
      # the unmatched region followed by the C run after it - which is exactly
      # the layout the compiler produces inside one TU.  Bodies are unchanged,
      # redistributed over src/shop_menu/main/misc{,2..9}.c.
      - [0xCBC, c, main/misc2]
      - [0x6CF0, c, main/misc3]
      - [0x7278, c, main/misc4]
      - [0x7720, c, main/misc5]
      - [0x7FF4, c, main/misc6]
      - [0x8D14, c, main/misc7]
      - [0x991C, c, main/misc8]
      - [0xAF58, c, main/misc9]
      - [0xCF50, data]
      - { vram: 0x801d2800, type: bss }
  - [0xD800]
