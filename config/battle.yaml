name: Battle Overlay
sha1: 124703d415f570f9cd8d7dad89c6a4eddfd7e6f0
options:
  basename: battle.bin
  target_path: disc/battle.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/battle
  src_path: src/battle
  build_path: build/

  ld_script_path: linker/battle.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False
  # NB: no `generate_asm_macros_files` here.  That is a newer-splat option; the
  # pinned 0.33.2 rejects it, gears ignores splat's nonzero exit, and the whole
  # overlay split silently vanishes (surfacing later as a missing linker script).

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.battle.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - configs/reloc_addrs.battle.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.battle.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.battle.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true

segments:
  - name: battle
    type: code
    start: 0x0
    vram: 0x8006faf0
    align: 4
    subalign: 4
    subsegments:
      # The overlay starts with its literal strings, pointers, and dispatch
      # tables.  Code starts at file offset 0x133C / VRAM 0x80070E2C;
      # the externally called state-2 entry follows at 0x1450 / 0x80070F40.
      # The overlay leads with its rodata block (literal strings, pointer and
      # dispatch tables) exactly as the other overlays do; modelling it as
      # `data` would make gears place it after .text and move every byte.
      - [0x0, rodata]
      # Compiler-emitted switch tables of byte-exact C bodies live in the C
      # object's .rodata and are placed at their retail table address (as field
      # does).  Tables belonging to bodies that are still retail assembly stay
      # in the assembled data, where `jlabel` exports their .L targets.
      - [0x8C, .rodata, main14]      # jtbl_8006FB7C + jtbl_8006FBDC
      - [0x14C, rodata]
      - [0x520, .rodata, main35_p1]  # jtbl_80070010 (func_8008115C)
      - [0x540, rodata]
      - [0x133C, c, mainasm_133C]
      # The retail overlay interleaves still-assembly functions with C runs.
      # INCLUDE_ASM expands to a file-scope __asm__ block and cc1 emits every
      # such block before every compiled body, so a TU that mixes both pushes
      # all of its C functions to the end of the object (measured: a single
      # battle TU puts them +0x51034 bytes in). Model one TU per retail run
      # pair - the unmatched region followed by the C run after it - exactly as
      # shop_menu/main/misc{,2..9}.c does. Bodies are redistributed over
      # src/battle/main{,2..61}.c (plus mainl* for the addiu-flavoured li TUs); each entry starts where the previous C run
      # ended and ends where its own C run ends.
      - [0x1450, c, main]
      - [0x1FF0, c, main2]
      - [0x6A54, c, main3]
      - [0x6F20, c, main4]
      - [0x7010, c, main5]
