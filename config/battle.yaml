  # Retail g_MainGameStates[2] clears this exact range before loading the
  # overlay: pMemStart 0x800C3A6C through pHeapStart 0x800D39F0.
  # Kept as its own all-NOLOAD top-level segment so splat emits an explicit
  # section address: the .bss inputs are 16-byte aligned on this target, so an
  # address-less section would be rounded up from 0x800C3A6C to 0x800C3A70 and
  # every BSS symbol (and every %lo reference to it) would be 4 bytes high.
  - name: battle_bss
    type: code
    start: 0x53f7c
    vram: 0x800c3a6c
    bss_size: 0xFF84
    # 4, not the 16-byte default: this segment must not advance __romPos (it
    # is all-NOLOAD and starts exactly at the end of the loadable part), or the
    # trailing 0x53F7C databin slides 4 bytes and the ROM grows past retail.
    align: 4
    subsegments:
      - { vram: 0x800c3a6c, type: bss }

  # The archive carries one zero padding word at the BSS boundary.
  - [0x53f7c, databin]
  - [0x53f80]
