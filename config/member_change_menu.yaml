name: Member Change Menu Overlay
sha1: 06492cab5f5940ed493ae16069e1cee23f2fa622
options:
  basename: member_change_menu.bin
  target_path: disc/member_change_menu.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/member_change_menu
  src_path: src/member_change_menu
  build_path: build/

  ld_script_path: linker/member_change_menu.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.member_change_menu.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - configs/reloc_addrs.member_change_menu.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.member_change_menu.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.member_change_menu.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: member_change_menu
    type: code
    start: 0x0
    vram: 0x801c5000
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, main/misc]
      - [0x18, c, main/misc]
      - [0x6180, data]
      - { vram: 0x801CB59C, type: bss }
  - [0x659C, databin]
  - [0x6800]