name: Menu Overlay
sha1: fd911d26b921d6eb0c73c3bbc83ea82dc459122f
options:
  basename: menu.bin
  target_path: disc/menu.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/menu
  src_path: src/menu
  build_path: build/

  ld_script_path: linker/menu.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.menu.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - configs/reloc_addrs.menu.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.menu.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.menu.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: menu
    type: code
    start: 0x0
    vram: 0x801c5000
    bss_size: 0x20000
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, main/misc]
      # misc2 / misc3 are separate retail TUs (see the note at the top of
      # src/menu/main/misc.c): each begins where a jump table must open its
      # TU's .rodata to keep retail's 4-mod-8 alignment.
      - [0x22c, .rodata, main/misc2]
      - [0x278, .rodata, main/misc3]
      - [0x31c, c, main/misc]
      - [0x1eecc, c, main/misc2]
      - [0x23070, c, main/misc3]
      - [0x246a4, data]
      - { vram: 0x801ea908, type: bss }
  - [0x25908]
