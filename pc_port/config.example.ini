# Xenogears PC port configuration (example).  Copy to config.ini next to
# the xeno-port executable or to ~/.config/xenogears-port/config.ini, or pass
# --config FILE.  Precedence: --set key=value > XENO_<SECTION>_<KEY>
# environment variables (e.g. XENO_VIDEO_WIDTH=1280) > this file.

[video]
backend = psycross      # only backend in this build
internal_resolution = 2 # N x 320x240 (PsyCross renders at the window size)
# width = 640           # explicit window size overrides internal_resolution
# height = 480
fullscreen = off
vsync = on
bilinear = off          # bilinear texture filtering
widescreen = off        # 16:9 view (not supported by the PsyCross backend yet)
fps = 30                # 60 needs interpolation (not implemented yet)

[game]
speed = 1               # 1..5 wall-clock multiplier (also XENO_SPEED)
fast_forward_speed = 5  # 1..5 while the fast-forward key is held

[audio]
backend = psycross
volume = 100            # 0..100 (not supported by the PsyCross backend yet)

[input]                 # SDL key names; defaults depend on the pad layout
backend = psycross
# circle = Z
# cross = X
# triangle = V
# square = C
# start = Return
# select = Space
# Game controller: which physical face button confirms.  cross = the bottom
# button (Xbox A, PlayStation Cross; retail USA, the default), circle = the
# right button (Xbox B, PlayStation Circle; Japanese-style).  Only Cross and
# Circle trade places; the rest of the pad is unchanged.  The left stick also
# works as the D-pad.  With several controllers attached one drives the game:
# a real or handheld pad is preferred over Steam's virtual pad.
# pad_confirm = cross
# The dev menu's Options page (CONFIRM BUTTON) changes this at run time and
# saves it to the user's config file; without the menu, edit it here.
# Pad fast-forward: off by default.  on = L3 toggles fast-forward and R3 holds
# it, each only when pressed ALONE (ignored while a face button or D-pad is
# held, a guard against mis-mapped handheld pads).  The keyboard always has
# Backspace (hold) and F6 (toggle); the dev menu has Options > FAST-FORWARD.
# XENO_INPUT_PAD_FAST_FORWARD=on also works.
# pad_fast_forward = off

[mods]
enabled = on            # load mods/ (see docs/port/ARCHITECTURE.md)
# dir = mods

[cheats]
dev_menu = off          # opt-in dev menu (also XENO_DEV_MENU=1): Select+Start on one pad, or F8
                        # XENO_CHEATS=0 hard-disables the menu and every cheat
console = off           # read cheat commands from stdin (see docs/port/ARCHITECTURE.md)
